name: umami-dashboard
services:
  api:
    image: ${IMAGE_REGISTRY:-local}/umami-dashboard-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        IMAGE_SOURCE: ${IMAGE_SOURCE:-https://github.com/jpligthart/UmamiDashboard}
        IMAGE_VERSION: ${IMAGE_TAG:-0.1.0}
        IMAGE_REVISION: ${IMAGE_REVISION:-unknown}
        IMAGE_CREATED: ${IMAGE_CREATED:-2026-11-24T00:00:00Z}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DASHBOARD_CONFIG: /app/config/dashboard.json
    expose: ["3000"]
    volumes:
      - type: bind
        source: ./config/dashboard.json
        target: /app/config/dashboard.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
  web:
    image: ${IMAGE_REGISTRY:-local}/umami-dashboard-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        IMAGE_SOURCE: ${IMAGE_SOURCE:-https://github.com/jpligthart/UmamiDashboard}
        IMAGE_VERSION: ${IMAGE_TAG:-0.1.0}
        IMAGE_REVISION: ${IMAGE_REVISION:-unknown}
        IMAGE_CREATED: ${IMAGE_CREATED:-2026-11-24T00:00:00Z}
    ports: ["127.0.0.1:${DASHBOARD_PORT:-18470}:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
